# =============================================================================
# ODA Login Theme - theme.properties
# =============================================================================
# Extends the built-in "keycloak" theme so register, reset-password, OTP and
# other auth pages inherit the same look. We override the kc* class mappings
# below so every template renders with our custom oda-* classes instead of
# PatternFly classes.
#
# All branding / connection values are configurable via environment variables
# using the ${env.VAR:default} syntax. See .env.example at the repo root for
# the full list of supported variables.
# =============================================================================

parent=keycloak

# -----------------------------------------------------------------------------
# Styles & scripts (loaded by template.ftl)
# -----------------------------------------------------------------------------
styles=css/styles.css
scripts=js/login.js

# -----------------------------------------------------------------------------
# CSS class mappings (kc* -> oda-*)
# -----------------------------------------------------------------------------
kcHtmlClass=oda-html
kcBodyClass=oda-body
kcLoginClass=oda-login
kcFormClass=oda-form
kcFormGroupClass=oda-form-group
kcLabelClass=oda-label
kcInputClass=oda-input
kcInputErrorMessageClass=oda-input-error
kcInputGroup=oda-input-group
kcButtonClass=oda-button
kcButtonPrimaryClass=oda-button--primary
kcButtonBlockClass=oda-button--block
kcButtonLargeClass=oda-button--large
kcFormCardClass=oda-card
kcFormHeaderClass=oda-card__header
kcAlertClass=oda-alert
kcAlertTitleClass=oda-alert__title
kcFormSocialAccountListClass=oda-social-list
kcFormSocialAccountListButtonClass=oda-social-button
kcFormSocialAccountListButtonDisabledClass=oda-social-button--disabled
kcFormSocialAccountNameClass=oda-social-name
kcFormSocialAccountSectionClass=oda-social-section
kcFormSocialAccountListGridClass=oda-social-grid
kcFormSocialAccountGridItem=oda-social-grid__item
kcCommonLogoIdP=oda-idp-icon
kcFormPasswordVisibilityButtonClass=oda-password-toggle
kcFormPasswordVisibilityIconShow=oda-icon oda-icon--eye
kcFormPasswordVisibilityIconHide=oda-icon oda-icon--eye-slash
kcFormOptionsWrapperClass=oda-form-options
kcFormSettingClass=oda-form-setting
kcSignUpClass=oda-signup
kcInfoAreaWrapperClass=oda-info-wrapper
kcHeaderClass=oda-header
kcHeaderWrapperClass=oda-header__wrapper

# -----------------------------------------------------------------------------
# Branding (configurable via environment variables)
# NOTE: keys are camelCase (no dots) so templates can read them directly as
# ${properties.odaBrandName!}
# -----------------------------------------------------------------------------
odaBrandName=${env.ODA_BRAND_NAME:ODA}
odaBrandTagline=${env.ODA_BRAND_TAGLINE:}
odaLogoUrl=${env.ODA_LOGO_URL:}
odaSupportEmail=${env.ODA_SUPPORT_EMAIL:}
odaPrivacyUrl=${env.ODA_PRIVACY_URL:}
odaTermsUrl=${env.ODA_TERMS_URL:}
odaHomeUrl=${env.ODA_HOME_URL:}

# -----------------------------------------------------------------------------
# Colors (configurable via environment variables)
# -----------------------------------------------------------------------------
odaPrimaryColor=${env.ODA_PRIMARY_COLOR:oklch(0.5635 0.2408 260.8178)}
odaPrimaryForeground=${env.ODA_PRIMARY_FOREGROUND:#ffffff}
odaAccentColor=${env.ODA_ACCENT_COLOR:oklch(0.6489 0.2370 26.9728)}